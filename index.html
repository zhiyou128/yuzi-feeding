<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>柚子辅食工作台</title>
  <link rel="stylesheet" href="styles.css?v=20260821" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"><i></i><b>•‿•</b></span>
        <div>
          <p class="eyebrow">YUZI FOOD CLUB</p>
          <h1>柚子辅食工作台</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="history-icon" data-action="open-history" type="button" aria-label="查看全部记录" title="全部记录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2M5.2 5.2A9 9 0 1 1 3 12M3 5v5h5" /></svg>

        <div class="baby-chip" aria-label="宝宝信息"><span class="baby-avatar"><img src="assets/hero/yuzi-baby.webp" alt="" /></span><span class="baby-chip-label">柚子 · 7 月龄</span></div>

    <main id="app" class="main-content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="主导航">

      <button class="nav-item" data-page="recipes" type="button"><span class="nav-icon">◡</span><span>菜品</span></button>

  <div id="modal-root" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20260821"></script>

</html>
